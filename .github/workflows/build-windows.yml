name: Build Hacker Toes for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: "Hacker-Toes-6.2.1 3"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "Hacker-Toes-6.2.1 3/package-lock.json"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Hacker-Toes-Windows-Installer
          path: "Hacker-Toes-6.2.1 3/release/*.exe"
          if-no-files-found: error
          retention-days: 14
